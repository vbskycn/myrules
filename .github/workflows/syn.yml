name: Sync Rules

on:
  # Runs every day at 04:00 Asia/Shanghai.
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync blackmatrix7/ios_rule_script
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          git clone --depth 1 --branch master https://github.com/blackmatrix7/ios_rule_script.git "$tmp_dir/ios_rule_script"

          for path in blank external icon rewrite script source; do
            mkdir -p "$path"
            rsync -a --delete "$tmp_dir/ios_rule_script/$path/" "$path/"
          done

          mkdir -p rule
          rsync -a --delete \
            --exclude="clash-rules/" \
            "$tmp_dir/ios_rule_script/rule/" rule/

          for file in .gitignore LICENSE README.md; do
            cp -a "$tmp_dir/ios_rule_script/$file" "$file"
          done

      - name: Sync Loyalsoldier/clash-rules
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          git clone --depth 1 --branch release https://github.com/Loyalsoldier/clash-rules.git "$tmp_dir/clash-rules"
          mkdir -p rule/clash-rules
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            "$tmp_dir/clash-rules/" rule/clash-rules/

      - name: Sync Aethersailor/Custom_OpenClash_Rules
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          git clone --depth 1 --branch main https://github.com/Aethersailor/Custom_OpenClash_Rules.git "$tmp_dir/custom-openclash-rules"
          mkdir -p Custom
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="cfg/*_my*.ini" \
            --exclude="rule/*_my*.list" \
            --exclude="rule/ai_my.list" \
            --exclude="rule/my_jiedian.list" \
            "$tmp_dir/custom-openclash-rules/" Custom/

      - name: Commit and push changes
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git fetch --depth 1 origin master
            if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
              echo "::error::origin/master has new commits. Re-run this workflow to sync from the latest master."
              exit 1
            fi

            git add -A
            git commit -m "Sync upstream rules, $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          else
            echo "No working tree changes to commit."
            exit 0
          fi

          git push origin HEAD:master
