name: Sync Rules

on:
  # Runs every day at 04:00 Asia/Shanghai.
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync blackmatrix7/ios_rule_script
        run: |
          set -euo pipefail

          backup_dir="$(mktemp -d)"
          restore_custom_rules() {
            if [ -d "$backup_dir/Custom" ]; then
              mkdir -p Custom
              rsync -a "$backup_dir/Custom/" Custom/
            fi
            rm -rf "$backup_dir"
          }
          trap restore_custom_rules EXIT

          mkdir -p "$backup_dir/Custom/cfg" "$backup_dir/Custom/rule"
          find Custom/cfg -maxdepth 1 -type f -iname "*_my*.ini" -exec cp -a {} "$backup_dir/Custom/cfg/" \; 2>/dev/null || true
          find Custom/rule -maxdepth 1 -type f \( -iname "*_my*.list" -o -iname "ai_my.list" -o -iname "my_jiedian.list" \) -exec cp -a {} "$backup_dir/Custom/rule/" \; 2>/dev/null || true

          git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git 2>/dev/null || git remote set-url upstream https://github.com/blackmatrix7/ios_rule_script.git
          git fetch --prune upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "blackmatrix7/ios_rule_script is already included."
            exit 0
          fi

          git merge --no-edit -X theirs upstream/master

      - name: Sync Loyalsoldier/clash-rules
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          git clone --depth 1 --branch release https://github.com/Loyalsoldier/clash-rules.git "$tmp_dir/clash-rules"
          mkdir -p rule/clash-rules
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            "$tmp_dir/clash-rules/" rule/clash-rules/

      - name: Sync Aethersailor/Custom_OpenClash_Rules
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          git clone --depth 1 --branch main https://github.com/Aethersailor/Custom_OpenClash_Rules.git "$tmp_dir/custom-openclash-rules"
          mkdir -p Custom
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="cfg/*_my*.ini" \
            --exclude="rule/*_my*.list" \
            --exclude="rule/ai_my.list" \
            --exclude="rule/my_jiedian.list" \
            "$tmp_dir/custom-openclash-rules/" Custom/

      - name: Commit and push changes
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Sync upstream rules, $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          else
            echo "No working tree changes to commit."
          fi

          git fetch origin master

          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::origin/master has new commits. Re-run this workflow to sync from the latest master."
            exit 1
          fi

          if [ "$(git rev-list --count origin/master..HEAD)" = "0" ]; then
            echo "No local commits to push."
            exit 0
          fi

          git push origin HEAD:master
