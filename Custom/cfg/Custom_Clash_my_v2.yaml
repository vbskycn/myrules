# ============================================================
# Custom_Clash_my.yaml
# 用途：Sub-Store -> Mihomo/OpenClash
#
# 说明：
# 1. 本文件把原来的 Subconverter .ini 配置迁移为 Mihomo YAML。
# 2. 不在这里写死机场节点；Sub-Store 负责把订阅节点放入 proxies。
# 3. proxy-groups 使用 include-all + filter，让新增节点自动进入对应分组。
# 4. 规则集保留原文件中的规则来源；删除了重复的 Custom_Direct。
# 5. 本文件可以作为 Sub-Store 的 Mihomo 配置/覆写基础配置使用。
# ============================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true

# -------------------- DNS --------------------
# 如果你原来的配置没有 DNS 要求，可删除整个 dns 段。
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"

