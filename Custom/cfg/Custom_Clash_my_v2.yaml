# ============================================================
# 代理组
#
# 这里不写死机场节点。
# include-all: true 会自动纳入 Sub-Store 注入的全部代理。
# filter 再按照节点名称筛选。
# ============================================================
proxy-groups:

  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 手动切换
      - 🎯 全球直连
      - Ⓜ️ARM节点
      - 💬CF解锁节点
      - 📢CF免费节点
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇹🇼 台湾节点
      - 🇰🇷 韩国节点
      - 🇨🇦 加拿大节点
      - 🇬🇧 英国节点
      - 🇫🇷 法国节点
      - 🇩🇪 德国节点
      - 🇳🇱 荷兰节点
      - 🇹🇷 土耳其节点
      - 🇮🇳 印度节点
      - 🇻🇳 越南节点

  - name: 🚀 手动切换
    type: select
    include-all: true

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    filter: '^(?!.*(aws|amd)).*$'
    url: http://cp.cloudflare.com/generate_204
